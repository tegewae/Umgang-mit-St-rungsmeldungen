<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden – AES Störungsmanagement</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="abbr">AES</div>
      <h1>Störungsmanagement</h1>
      <p>Abwasserentsorgung – Betriebssystem</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="alerts" style="margin-bottom:1rem;">
          {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post">
      <div class="form-group mb-2">
        <label for="name">Benutzername</label>
        <input type="text" id="name" name="name" required autofocus autocomplete="username">
      </div>
      <div class="form-group mb-2">
        <label for="passwort">Passwort</label>
        <input type="password" id="passwort" name="passwort" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.8rem;">Anmelden</button>
    </form>
  </div>
</div>
</body>
</html>
